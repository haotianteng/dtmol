  weight: 0.20
  frame_stride: 10

ani2x:
  path: /data/dtMol_Project/datasets/ANI-2x/unified/valid.lmdb
  weight: 0.15

spice2:
  path: /data/dtMol_Project/datasets/SPICE2/unified/valid.lmdb
  weight: 0.15

qm9:
  path: /data/dtMol_Project/datasets/QM9/unified/valid.lmdb
  weight: 0.10

irc:
  path: /data/dtMol_Project/datasets/Transition1x/unified/valid.lmdb
  weight: 0.10

pdb_apo:
  path: /data/dtMol_Project/datasets/PDB_apo/unified/valid.lmdb
  weight: 0.05
