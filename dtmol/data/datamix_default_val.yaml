# Default validation datamix configuration for dtmol unified training.
# All 7 converted datasets at /data/dtMol_Project/datasets/.
# Weights sum to 1.0.

pdbbind:
  path: /data/dtMol_Project/datasets/PDBBind/unified/valid.lmdb
  weight: 0.25

misato:
